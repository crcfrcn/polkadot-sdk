name: polkadot-sdk.sdk
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  workflow_dispatch:
concurrency:
  group: "${{ github.repository }}-sdk"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 先执行本仓代码回归
        shell: bash
        run: node --test scripts/build.mjs
      - name: 恢复本SDK Cargo增量缓存
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/build/sdk/work/cargo-target
          key: "polkadot-sdk-cargo-v1-macOS-ARM64-sdk-${{ hashFiles('Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: |
            polkadot-sdk-cargo-v1-macOS-ARM64-sdk-${{ hashFiles('Cargo.lock', 'scripts/build.mjs') }}-
      - name: 全量编译、测试、组包并回读正式版
        id: sdk_release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          #!/usr/bin/env node
          // SDK automation: build and verify the complete workspace before publishing its archive.
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { cpSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          
          const repository = 'crcfrcn/polkadot-sdk';
          const fail = message => { throw Error(message); };
          const env = name => { const value = process.env[name]; if (!value) fail(`缺少 ${name}`); return value; };
          function checkRun() {
            if (env('GITHUB_REPOSITORY') !== repository || env('GITHUB_REF') !== 'refs/heads/main' || env('GITHUB_EVENT_NAME') !== 'workflow_dispatch') fail('SDK 正式版只允许本仓 main 手动自动化');
            const sha = env('GITHUB_SHA');
            if (!/^[0-9a-f]{40}$/u.test(sha)) fail('源码提交无效');
            return sha;
          }
          async function api(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${env('GH_TOKEN')}`, 'X-GitHub-Api-Version': '2022-11-28' }, redirect: 'error', signal: AbortSignal.timeout(15000) });
            if (!response.ok) fail(`GitHub 读取失败：${path} (${response.status})`);
            return response.json();
          }
          const number = version => { const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$/u.exec(version); return match ? Number(match[1]) * 10000 + Number(match[2]) * 100 + Number(match[3]) : null; };
          const version = value => `${Math.floor(value / 10000)}.${Math.floor(value / 100) % 100}.${value % 100}`;
          async function nextVersion() {
            let highest = 0;
            for (let page = 1; ; page++) {
              const releases = await api(`releases?per_page=100&page=${page}`);
              if (!Array.isArray(releases)) fail('Release 列表无效');
              for (const release of releases) {
                if (release.draft || release.prerelease) continue;
                const match = /^polkadot-sdk-sdk-v(.+)-r[1-9][0-9]*-a[1-9][0-9]*$/u.exec(release.tag_name || '');
                if (match) { const current = number(match[1]); if (current === null) fail('正式版版本无效'); highest = Math.max(highest, current); }
              }
              if (releases.length < 100) break;
            }
            const candidate = Math.max(Number(env('GITHUB_RUN_NUMBER')), highest + 1);
            if (!Number.isSafeInteger(candidate) || candidate < 1) fail('SDK 版本越界');
            return version(candidate);
          }
          function cargo(cargoPath, args, environment) { execFileSync(cargoPath, args, { stdio: 'inherit', env: environment }); }
          async function main() {
            const sha = checkRun();
            const releaseVersion = await nextVersion();
            const tag = `polkadot-sdk-sdk-v${releaseVersion}-r${env('GITHUB_RUN_ID')}-a${env('GITHUB_RUN_ATTEMPT')}`;
            const build = await import('./scripts/build.mjs');
            const work = join(process.cwd(), 'target/build/sdk');
            mkdirSync(work, { recursive: true });
            const receipt = await build.prepareResourceSupply('sdk', work, { run_id: env('GITHUB_RUN_ID') }, { offline: false });
            const environment = { ...build.resourceEnvironment('sdk', work, receipt), CARGO_INCREMENTAL: '1', CARGO_NET_OFFLINE: 'true' };
            const cargoPath = join(dirname(receipt.tools.rust.path), 'cargo');
            cargo(cargoPath, ['fmt', '--all', '--', '--check'], environment);
            cargo(cargoPath, ['build', '--workspace', '--all-targets', '--release', '--locked', '--offline'], environment);
            cargo(cargoPath, ['test', '--workspace', '--all-targets', '--release', '--locked', '--offline'], environment);
            cargo(cargoPath, ['package', '--workspace', '--allow-dirty', '--locked', '--offline'], environment);
            const stage = join(env('RUNNER_TEMP'), 'polkadot-sdk-release');
            mkdirSync(stage, { recursive: true });
            execFileSync('git', ['archive', '--format=tar', '--output', join(stage, 'source.tar'), sha], { stdio: 'inherit' });
            const crates = join(environment.CARGO_TARGET_DIR, 'package');
            if (!readdirSync(crates).some(name => name.endsWith('.crate'))) fail('SDK crate 产物缺失');
            cpSync(crates, join(stage, 'crates'), { recursive: true });
            writeFileSync(join(stage, 'sdk.json'), JSON.stringify({ schema: 1, repository, product_id: 'polkadot-sdk', platform: 'sdk', workflow: '.github/workflows/sdk.yml', source_sha: sha, version: releaseVersion, tag, run_id: Number(env('GITHUB_RUN_ID')), run_attempt: Number(env('GITHUB_RUN_ATTEMPT')) }, null, 2) + '\n');
            const archive = join(env('RUNNER_TEMP'), 'polkadot-sdk.tgz');
            execFileSync('tar', ['-czf', archive, '-C', stage, '.'], { stdio: 'inherit' });
            if (!statSync(archive).size) fail('SDK 正式包为空');
            const digest = `sha256:${createHash('sha256').update(readFileSync(archive)).digest('hex')}`;
            writeFileSync(env('GITHUB_OUTPUT'), 'cargo_cache_ready=true\n', { flag: 'a' });
            execFileSync('gh', ['release', 'create', tag, archive, '--repo', repository, '--target', sha, '--title', `polkadot-sdk · sdk · ${releaseVersion}`, '--notes', `GitHub 自动化正式 SDK；源码 ${sha}；Run ${env('GITHUB_RUN_ID')}。`, '--latest=false'], { stdio: 'inherit', env: { ...process.env, GH_TOKEN: env('GH_TOKEN') } });
            const release = await api(`releases/tags/${encodeURIComponent(tag)}`);
            const tagRef = await api(`git/ref/tags/${encodeURIComponent(tag)}`);
            if (tagRef.ref !== `refs/tags/${tag}` || tagRef.object?.type !== 'commit' || tagRef.object.sha !== sha
                || release.draft || release.prerelease || release.target_commitish !== sha || release.assets?.length !== 1
                || release.assets[0].name !== 'polkadot-sdk.tgz' || release.assets[0].state !== 'uploaded' || release.assets[0].digest !== digest)
              fail('SDK Tag或正式Release回执与本轮源码不一致');
          }
          try { await main(); } catch (error) { console.error(error.message); process.exitCode = 1; }
          NODE
      - name: 保存本SDK Cargo增量缓存
        id: cargo_cache_save
        if: always() && steps.sdk_release.outputs.cargo_cache_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/build/sdk/work/cargo-target
          key: "polkadot-sdk-cargo-v1-macOS-ARM64-sdk-${{ hashFiles('Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
  cargo-retention:
    needs: release
    if: always() && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
      CARGO_CACHE_KEY: "polkadot-sdk-cargo-v1-macOS-ARM64-sdk-${{ hashFiles('Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 只保留本SDK最新Cargo增量缓存
        shell: bash
        run: node --input-type=module -e 'import("./scripts/build.mjs").then(module => module.polkadotCachePrune())'
  run-retention:
    needs: [release, cargo-retention]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
      SDK_FINAL_OUTCOME: "${{ needs.release.result == 'success' && needs.cargo-retention.result == 'success' && 'success' || 'failure' }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 仅保留本SDK最新成功与失败Run
        shell: bash
        run: node --input-type=module -e 'import("./scripts/build.mjs").then(module => module.polkadotRunPrune(process.env.SDK_FINAL_OUTCOME))'
