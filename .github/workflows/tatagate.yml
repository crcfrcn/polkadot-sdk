name: tatagate

# 中文说明：main代码推送独立触发本仓塔塔门禁；CI和Release仍保持自己的手动流程。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tatagate-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出准确推送提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 登记Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 登记Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: 验真Workflow检查器
        shell: bash
        run: |
          set -euo pipefail
          tool="$(mktemp -d "$RUNNER_TEMP/tatagate-actionlint-XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -o "$tool/archive.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tool/archive.tar.gz" > "$tool/SHA256"
          sha256sum -c "$tool/SHA256"
          tar -xzf "$tool/archive.tar.gz" -C "$tool" actionlint
          chmod 755 "$tool/actionlint"
          printf 'TATAGATE_ACTIONLINT=%s\n' "$tool/actionlint" >> "$GITHUB_ENV"
      - name: 验真Git
        shell: bash
        run: |
          set -euo pipefail
          tool="$(mktemp -d "$RUNNER_TEMP/tatagate-git-XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz' -o "$tool/archive.tar.xz"
          printf '%s  %s\n' 'f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3' "$tool/archive.tar.xz" > "$tool/SHA256"
          sha256sum -c "$tool/SHA256"
          tar -xf "$tool/archive.tar.xz" -C "$tool"
          make -C "$tool/git-2.54.0" -j2 NO_GETTEXT=YesPlease NO_TCLTK=YesPlease prefix="$tool/payload" install
          test "$("$tool/payload/bin/git" --version)" = 'git version 2.54.0'
          printf 'PRODUCT_GIT_BIN=%s\n' "$tool/payload/bin/git" >> "$GITHUB_ENV"
      - name: 本仓完整塔塔门禁
        shell: bash
        run: |
          set -euo pipefail
          TATAGATE_CARGO="$(rustup which --toolchain 1.97.1 cargo)"
          TATAGATE_RUSTC="$(rustup which --toolchain 1.97.1 rustc)"
          export TATAGATE_CARGO TATAGATE_RUSTC
          export CARGO_TARGET_DIR="$RUNNER_TEMP/polkadot-sdk/target"
          "$PRODUCT_GIT_BIN" remote set-url origin "https://github.com/crcfrcn/polkadot-sdk.git"
          node .github/tatagate/index.mjs remote
