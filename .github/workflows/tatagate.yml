name: polkadot-sdk.tatagate
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  push:
    branches: [main]
concurrency:
  group: "${{ github.repository }}-tatagate"
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  gate:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 执行本仓塔塔门禁
      run: node .github/tatagate/index.mjs github
  cleanup:
    needs: [gate]
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 清理本仓同类旧门禁记录
      env:
        GH_TOKEN: "${{ github.token }}"
        TATAGATE_RESULT: "${{ needs.gate.result }}"
      run: node .github/tatagate/index.mjs cleanup
