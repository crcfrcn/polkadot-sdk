name: tatagate

# 中文说明：main代码推送独立触发本仓塔塔门禁；CI和Release仍保持自己的手动流程。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tatagate-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 核对官方Runner及独立准备根
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = crcfrcn/polkadot-sdk
          test "$GITHUB_REF" = refs/heads/main
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -qx 'VERSION_ID="24.04"' /etc/os-release
          test "$(uname -m)" = x86_64
          test "$(readlink -f "$RUNNER_TEMP")" = /home/runner/work/_temp
          work=/home/runner/work/_temp/polkadot-sdk-tatagate
          test ! -e "$work" && test ! -L "$work"
          test "$(rustup --version | cut -d ' ' -f 2)" = 1.29.1
          test "$(/usr/local/bin/cmake --version | head -n 1)" = 'cmake version 3.31.6'
          /usr/lib/llvm-18/bin/clang --version | grep -E '^Ubuntu clang version 18\.1\.3( |$)'
          test -f /usr/lib/llvm-18/lib/libclang.so.1
          # 仅消费镜像已有匹配运行库和zlib开发输入；不联网解决系统包依赖。
          test "$(dpkg-query -W -f='${Status} ${Version}' libcurl4t64:amd64)" = 'install ok installed 8.5.0-2ubuntu10.15'
          test "$(dpkg-query -W -f='${Status} ${Version}' libexpat1:amd64)" = 'install ok installed 2.6.1-2ubuntu0.6'
          test "$(dpkg-query -W -f='${Status} ${Version}' zlib1g-dev:amd64)" = 'install ok installed 1:1.3.dfsg-3.1ubuntu2.2'
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)" -ge 32212254720
          mkdir -m 700 "$work"
          mkdir "$work/archives" "$work/tools"
          printf 'TATAGATE_WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - name: 检出准确推送提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 登记Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 登记Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy,rust-src
          targets: wasm32-unknown-unknown
      - name: 验真Workflow检查器
        shell: bash
        run: |
          set -euo pipefail
          tool="$TATAGATE_WORK/tools/actionlint"
          mkdir "$tool"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -o "$tool/archive.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tool/archive.tar.gz" > "$tool/SHA256"
          sha256sum -c "$tool/SHA256"
          tar -xzf "$tool/archive.tar.gz" -C "$tool" actionlint
          chmod 755 "$tool/actionlint"
          printf 'TATAGATE_ACTIONLINT=%s\n' "$tool/actionlint" >> "$GITHUB_ENV"
      - name: 验真Git
        shell: bash
        run: |
          set -euo pipefail
          # Linux平台C开发头文件是Git的HTTPS编译输入；不能因缺curl头文件关闭HTTPS功能。
          archives="$TATAGATE_WORK/archives"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://security.ubuntu.com/ubuntu/pool/main/c/curl/libcurl4-openssl-dev_8.5.0-2ubuntu10.15_amd64.deb' -o "$archives/libcurl4-openssl-dev_8.5.0-2ubuntu10.15_amd64.deb"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://security.ubuntu.com/ubuntu/pool/main/e/expat/libexpat1-dev_2.6.1-2ubuntu0.6_amd64.deb' -o "$archives/libexpat1-dev_2.6.1-2ubuntu0.6_amd64.deb"
          printf '%s  %s\n' \
            'c63393dd39d8bc49580e3e23be3eda63ce62ae4823d95f692c7547b25ade8a31' "$archives/libcurl4-openssl-dev_8.5.0-2ubuntu10.15_amd64.deb" \
            '87281ce46d74f261caff4ac404fe5af7b07f185d305246fef81797ddc20fa9f8' "$archives/libexpat1-dev_2.6.1-2ubuntu0.6_amd64.deb" > "$archives/git-headers.SHA256"
          sha256sum -c "$archives/git-headers.SHA256"
          sudo dpkg --install "$archives/libcurl4-openssl-dev_8.5.0-2ubuntu10.15_amd64.deb" "$archives/libexpat1-dev_2.6.1-2ubuntu0.6_amd64.deb"
          test "$(dpkg-query -W -f='${Status} ${Version}' libcurl4-openssl-dev:amd64)" = 'install ok installed 8.5.0-2ubuntu10.15'
          test "$(dpkg-query -W -f='${Status} ${Version}' libexpat1-dev:amd64)" = 'install ok installed 2.6.1-2ubuntu0.6'
          tool="$TATAGATE_WORK/tools/git"
          mkdir "$tool"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz' -o "$tool/archive.tar.xz"
          printf '%s  %s\n' 'f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3' "$tool/archive.tar.xz" > "$tool/SHA256"
          sha256sum -c "$tool/SHA256"
          tar -xf "$tool/archive.tar.xz" -C "$tool"
          make -C "$tool/git-2.54.0" -j2 CC=/usr/lib/llvm-18/bin/clang NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_INSTALL_HARDLINKS=YesPlease prefix="$tool/payload" install
          test "$(stat -c '%h' "$tool/payload/bin/git")" = 1
          test "$("$tool/payload/bin/git" --version)" = 'git version 2.54.0'
          printf 'PRODUCT_GIT_BIN=%s\n' "$tool/payload/bin/git" >> "$GITHUB_ENV"
      - name: 验真既有缺失编译工具并交付同一Rust对象
        shell: bash
        run: |
          set -euo pipefail
          archives="$TATAGATE_WORK/archives"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.30+commit.73712a01' -o "$archives/solc-linux-amd64-v0.8.30+commit.73712a01"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl' -o "$archives/resolc-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip' -o "$archives/protoc-35.0-linux-x86_64.zip"
          printf '%s  %s\n' \
            'f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7' "$archives/solc-linux-amd64-v0.8.30+commit.73712a01" \
            'e626ba7a1a0d26828c14713781b0082ececc9a0fbfe984f11f0d93d66bbd7806' "$archives/resolc-x86_64-unknown-linux-musl" \
            'a45cda0989c17dd950db55f6fbe1e5814c50fda08e87aa422980ac1f89dddbbc' "$archives/protoc-35.0-linux-x86_64.zip" > "$archives/compilers.SHA256"
          sha256sum -c "$archives/compilers.SHA256"
          mkdir -p "$TATAGATE_WORK/tools/solidity/bin"
          mkdir "$TATAGATE_WORK/tools/protoc"
          install -m 755 "$archives/solc-linux-amd64-v0.8.30+commit.73712a01" "$TATAGATE_WORK/tools/solidity/bin/solc"
          install -m 755 "$archives/resolc-x86_64-unknown-linux-musl" "$TATAGATE_WORK/tools/solidity/bin/resolc"
          unzip -q "$archives/protoc-35.0-linux-x86_64.zip" -d "$TATAGATE_WORK/tools/protoc"
          cargo="$(readlink -f "$(rustup which --toolchain 1.97.1 cargo)")"
          rustc="$(readlink -f "$(rustup which --toolchain 1.97.1 rustc)")"
          rustdoc="$(readlink -f "$(rustup which --toolchain 1.97.1 rustdoc)")"
          node="$(readlink -f /opt/hostedtoolcache/node/25.2.1/x64/bin/node)"
          printf '%s\n' \
            "TATAGATE_CARGO=$cargo" "CARGO=$cargo" "TATAGATE_RUSTC=$rustc" "RUSTC=$rustc" "RUSTDOC=$rustdoc" \
            "TATAGATE_NODE=$node" "CC=$(readlink -f /usr/lib/llvm-18/bin/clang)" "CXX=/usr/lib/llvm-18/bin/clang++" \
            "LIBCLANG_PATH=/usr/lib/llvm-18/lib" "CMAKE_COMMAND=$(readlink -f /usr/local/bin/cmake)" \
            "CMAKE_MAKE_PROGRAM=/usr/bin/make" "PROTOC=$TATAGATE_WORK/tools/protoc/bin/protoc" \
            "CARGO_HOME=$TATAGATE_WORK/cargo/home" "CARGO_BUILD_JOBS=2" "CARGO_PROFILE_DEV_DEBUG=0" \
            "CARGO_PROFILE_TEST_DEBUG=0" "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          # 子构建继承同一明确工具集，不借用另一产品或用户Cargo缓存。
          printf '%s\n' \
            "$(dirname "$cargo")" "$TATAGATE_WORK/tools/solidity/bin" "$TATAGATE_WORK/tools/protoc/bin" \
            "$TATAGATE_WORK/tools/git/payload/bin" "$TATAGATE_WORK/tools/actionlint" \
            /usr/local/bin /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: 本仓联合闭包一次准备及完整离线门禁
        shell: bash
        run: |
          set -euo pipefail
          "$PRODUCT_GIT_BIN" remote set-url origin "https://github.com/crcfrcn/polkadot-sdk.git"
          "$TATAGATE_NODE" .github/tatagate/index.mjs prepare
          "$TATAGATE_NODE" .github/tatagate/index.mjs remote
